[project]
name = "radar"
version = "0.1.0"
description = "Remote Radar pipeline: ingest remote job postings, extract structured data with LLMs, publish dashboard snapshots"
authors = [{ name = "navi", email = "intenza2k@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "selectolax>=0.3",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "ollama>=0.4",
    "anthropic>=0.40",
    "onnxruntime>=1.31.1",
    "tokenizers>=0.23.3",
    "numpy>=2.5.4",
]

[project.scripts]
radar = "radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
