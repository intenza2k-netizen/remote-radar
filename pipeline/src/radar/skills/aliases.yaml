# Canonical skill vocabulary for Remote Radar.
#
# skills.<slug>: {display, category, aliases}
#   slug      lowercase, [a-z0-9-] only (c++ -> cpp, c# -> csharp, node.js -> nodejs)
#   category  one of: language framework cloud data devops database ai_ml tool design business other
#   aliases   alternative spellings; matching ignores case, spaces, dots, hyphens and slashes
#             ("React JS", "react.js" and "reactjs" are the same key), so list only spellings
#             that differ in letters. The slug and display name are always aliases of themselves.
# drop: vague non-skills and junk tags (roles, levels, departments, industries, soft skills).
#
# Loading validates that no alias (after that loose matching) maps to two canonicals.

