# memberships: which countries a macro region covers, for the "open to applicants in" rule
# (radar.geo, geo.json). Unlike `regions:` above this IS a hierarchy: a posting open to "EU" is
# open to a candidate in Estonia. Spellings are the canonical names of this file.
#   countries  every country or territory the site knows, one canonical spelling each. A typo in
#              a macro list that is not in this list fails validation.
#   macros     macro region -> members. A member is a country or another macro of this block
#              (expanded when loaded, so the published lists are flat). Overlaps are allowed
#              (Cyprus is in Europe and in Western Asia; Egypt is in Africa and the Middle East).
# Definitions are the usual ones; the judgement calls: Europe includes the UK, Switzerland,
# Ukraine, Russia and Belarus but not Türkiye or the South Caucasus (those sit in Western Asia,
# and everything is inside EMEA); North America is the UN "Northern America" (United States,
# Canada, Bermuda, Greenland, Saint Pierre and Miquelon), so Mexico is Latin America;
# Asia-Pacific is Asia without Western Asia and the Middle East, plus Oceania; Sub-Saharan Africa
# follows the UN split (Sudan is North Africa).
